                if (p.type === 'video') np = await processMedia(new File([blob], 'video.mp4', { type: blob.type || 'video/mp4' }));
                else { const img = await loadImage(blob); np = { id: await Store.upload(await resizeImage(img, 1600, 0.85), 'image/jpeg'), thumb: await Store.upload(await resizeImage(img, 480, 0.8), 'image/jpeg'), mini: await Store.upload(await resizeImage(img, 128, 0.75), 'image/jpeg') }; }
                Object.assign(np, { caption: p.caption || '', takenAt: p.takenAt || np.takenAt || '' });
                c.photos.push(np);
                if (raw.cover === p.id) c.cover = np.id;
              } catch (err) { console.warn(err); }
            }
            if (!c.cover && c.photos[0]) c.cover = c.photos[0].id;
            out.push(c);
          }
          const tOut = tripList.map(t => normalizeTrip({ ...t, id: uid(), cityIds: (t.cityIds || []).map(x => idMap[x]).filter(Boolean) }));
          await Store.replaceAll(out, tOut);
          toast(L(`Import terminé : ${out.length} lieux.`, `Import complete: ${out.length} places.`, {pt: `Importação concluída: ${out.length} lugares.`, es: `Importación completada: ${out.length} lugares.`, it: `Importazione completata: ${out.length} luoghi.`, de: `Import abgeschlossen: ${out.length} Orte.`}));
        } catch (err) { toast(L("L'import a échoué.", 'The import failed.', {pt: `A importação falhou.`, es: `La importación falló.`, it: `L'importazione non è riuscita.`, de: `Der Import ist fehlgeschlagen.`})); }
      });
    };
    reader.readAsText(file);
  }

  // ═════════════════════════════════════════════════════════════════════
  //  DIVERS
  // ═════════════════════════════════════════════════════════════════════
  function toggleMenu(e) { e && e.stopPropagation(); $('menu').classList.toggle('open'); updateMenu(); }
  function closeMenu() { $('menu').classList.remove('open'); }
  function menuDo(fn) { closeMenu(); fn(); }
  document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('.top-actions')) closeMenu(); });
  function updateMenu() {
    const m = settings.music;
    $('menu-music').textContent = m ? '♪ ' + m.name : L('Aucune musique', 'No music', {pt: `Sem música`, es: `Sin música`, it: `Nessuna musica`, de: `Keine Musik`});
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
    document.querySelectorAll('.local-only').forEach(el => el.classList.toggle('hidden', mode !== 'local'));
    updateInstallItem();
    document.querySelectorAll('.style-row button[data-style]').forEach(b => b.classList.toggle('active', b.dataset.style === globeStyle));
    const ls = $('menu-lite-state'); if (ls) ls.textContent = LITE ? L('Activé : globe plus léger pour les téléphones moins puissants', 'On: lighter globe for less powerful phones', {pt: `Ativado: globo mais leve para celulares menos potentes`, es: `Activado: globo más ligero para móviles menos potentes`, it: `Attiva: globo più leggero per telefoni meno potenti`, de: `An: leichterer Globus für schwächere Handys`}) : L('Désactivé : à activer si l’appli rame ou plante', 'Off: turn on if the app is slow or crashes', {pt: `Desativado: ative se o app ficar lento ou travar`, es: `Desactivado: actívalo si la app va lenta o se bloquea`, it: `Disattiva: attivala se l'app è lenta o si blocca`, de: `Aus: einschalten, wenn die App ruckelt oder abstürzt`});
  }
  function toggleLite() {
    lsSet('lite-mode', LITE ? 'off' : 'on'); lsSet('boot-pending', '0');
    toast(LITE ? L('Mode allégé désactivé, redémarrage…', 'Light mode off, restarting…', {pt: `Modo leve desativado, reiniciando…`, es: `Modo ligero desactivado, reiniciando…`, it: `Modalità leggera disattivata, riavvio…`, de: `Leicht-Modus aus, Neustart …`}) : L('Mode allégé activé, redémarrage…', 'Light mode on, restarting…', {pt: `Modo leve ativado, reiniciando…`, es: `Modo ligero activado, reiniciando…`, it: `Modalità leggera attiva, riavvio…`, de: `Leicht-Modus an, Neustart …`}));
    setTimeout(() => location.reload(), 900);
  }
  // ── Application installable (PWA) ──
  const PWA = !!document.querySelector('link[rel="manifest"]');
  const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installPrompt = null;
  function updateInstallItem() { const el = $('menu-install'); if (el) el.classList.toggle('hidden', !PWA || isStandalone() || !(installPrompt || isIOS)); }
  if (PWA) {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn(e)));
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; updateInstallItem(); });
    window.addEventListener('appinstalled', () => { installPrompt = null; updateInstallItem(); toast(L('✅ Application installée', '✅ App installed', {pt: `✅ App instalado`, es: `✅ App instalada`, it: `✅ App installata`, de: `✅ App installiert`})); });
  }
  async function installApp() {
    if (installPrompt) { installPrompt.prompt(); try { await installPrompt.userChoice; } catch (e) {} installPrompt = null; updateInstallItem(); return; }
    openDialog(`
      <h2>📲 ${L("Installer l'application", 'Install the app', {pt: `Instalar o app`, es: `Instalar la app`, it: `Installa l'app`, de: `App installieren`})}</h2>
      <p class="hint">${isIOS ? L('Dans <b>Safari</b>, touche le bouton <b>Partager</b> (le carré avec une flèche vers le haut), puis <b>« Sur l’écran d’accueil »</b>.', 'In <b>Safari</b>, tap the <b>Share</b> button (the square with an up arrow), then <b>“Add to Home Screen”</b>.', {pt: `No <b>Safari</b>, toque no botão <b>Compartilhar</b> (o quadrado com uma seta para cima) e depois em <b>“Adicionar à Tela de Início”</b>.`, es: `En <b>Safari</b>, toca el botón <b>Compartir</b> (el cuadrado con una flecha hacia arriba) y luego <b>“Añadir a pantalla de inicio”</b>.`, it: `In <b>Safari</b>, tocca il pulsante <b>Condividi</b> (il quadrato con la freccia in su), poi <b>“Aggiungi alla schermata Home”</b>.`, de: `Tippe in <b>Safari</b> auf <b>Teilen</b> (das Quadrat mit dem Pfeil nach oben) und dann auf <b>„Zum Home-Bildschirm“</b>.`}) : L('Ouvre le menu de ton navigateur (⋮) et choisis <b>« Installer l’application »</b> ou <b>« Ajouter à l’écran d’accueil »</b>.', 'Open your browser menu (⋮) and choose <b>“Install app”</b> or <b>“Add to Home screen”</b>.', {pt: `Abra o menu do navegador (⋮) e escolha <b>“Instalar app”</b> ou <b>“Adicionar à tela inicial”</b>.`, es: `Abre el menú del navegador (⋮) y elige <b>“Instalar aplicación”</b> o <b>“Añadir a pantalla de inicio”</b>.`, it: `Apri il menu del browser (⋮) e scegli <b>“Installa app”</b> o <b>“Aggiungi a schermata Home”</b>.`, de: `Öffne das Browsermenü (⋮) und wähle <b>„App installieren“</b> oder <b>„Zum Startbildschirm hinzufügen“</b>.`})}</p>
      <div class="dialog-actions"><button class="btn btn-primary" onclick="closeDialog()">${L('Compris !', 'Got it!', {pt: `Entendi!`, es: `¡Entendido!`, it: `Capito!`, de: `Verstanden!`})}</button></div>`);
  }
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast(L("Le plein écran n'est pas disponible ici.", 'Full screen is not available here.', {pt: `A tela cheia não está disponível aqui.`, es: `La pantalla completa no está disponible aquí.`, it: `Lo schermo intero non è disponibile qui.`, de: `Vollbild ist hier nicht verfügbar.`}))); else if (!p) toast(L("Le plein écran n'est pas disponible ici.", 'Full screen is not available here.', {pt: `A tela cheia não está disponível aqui.`, es: `La pantalla completa no está disponible aquí.`, it: `Lo schermo intero non è disponibile qui.`, de: `Vollbild ist hier nicht verfügbar.`})); }
    } catch (e) { toast(L("Le plein écran n'est pas disponible ici.", 'Full screen is not available here.', {pt: `A tela cheia não está disponível aqui.`, es: `La pantalla completa no está disponible aquí.`, it: `Lo schermo intero non è disponibile qui.`, de: `Vollbild ist hier nicht verfügbar.`})); }
  }
  // ── Changement de langue ──
  function applyStatic() {
    document.querySelectorAll('[data-en]').forEach(el => {
      if (el.dataset.fr === undefined) el.dataset.fr = el.innerHTML;
      el.innerHTML = LANG === 'fr' ? el.dataset.fr : (el.dataset[LANG] || el.dataset.en);
    });
    document.querySelectorAll('[data-en-title]').forEach(el => {
      if (el.dataset.frTitle === undefined) el.dataset.frTitle = el.title;
      el.title = LANG === 'fr' ? el.dataset.frTitle : (el.dataset[LANG + 'Title'] || el.dataset.enTitle);
    });
    document.querySelectorAll('[data-en-ph]').forEach(el => {
      if (el.dataset.frPh === undefined) el.dataset.frPh = el.placeholder;
      el.placeholder = LANG === 'fr' ? el.dataset.frPh : (el.dataset[LANG + 'Ph'] || el.dataset.enPh);
    });
    document.documentElement.lang = LANG;
    document.title = L('Mon Carnet de Voyage 3D', 'My 3D Travel Journal', {pt: `Meu Diário de Viagem 3D`, es: `Mi Diario de Viaje 3D`, it: `Il mio Diario di Viaggio 3D`, de: `Mein 3D-Reisetagebuch`});
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
    const sel = $('lang-select'); if (sel) sel.value = LANG;
  }
  function setLang(l) {
    if (!LANGS[l]) return;
    LANG = l; lsSet('lang', l);
    MONTHS = MONTHS_I18N[LANG];
    makeRegionNames();
    applyStatic();
    renderLegend(); rebuildMarkers(); updateStats(); updateCaption(); updateMenu(); updateBranding();
    if ($('overlay').classList.contains('open') && !dialogLocked) closeDialog();
    if (cardMode) renderCard();
    if ($('drawer').classList.contains('open')) { if (currentTab === 'places') renderList(); else renderTrips(); }
    if (lb) renderLightbox();
    if (companionFilter) $('filter-text').textContent = L(`👥 Lieux avec ${companionFilter} (${visibleCities().length})`, `👥 Places with ${companionFilter} (${visibleCities().length})`, {pt: `👥 Lugares com ${companionFilter} (${visibleCities().length})`, es: `👥 Lugares con ${companionFilter} (${visibleCities().length})`, it: `👥 Luoghi con ${companionFilter} (${visibleCities().length})`, de: `👥 Orte mit ${companionFilter} (${visibleCities().length})`});
  }
  function applyPermissions() {
    document.body.classList.toggle('readonly', !canWrite);
    document.body.classList.toggle('embedded', mode === 'embedded');
    updateMenu();
    if (cardMode) renderCard();
  }
  function onDataChanged() {
    if (cardMode && cardMode.type === 'place' && !byId(cardMode.id)) { $('card').classList.remove('open'); document.body.classList.remove('card-open'); cardMode = null; currentId = null; }
    if (cardMode && cardMode.type === 'trip' && !tripById(cardMode.id)) { $('card').classList.remove('open'); document.body.classList.remove('card-open'); cardMode = null; clearArcs(); }
    rebuildMarkers(); scheduleEarth(); updateStats(); updateCaption();
    if (cardMode) renderCard();
    if ($('drawer').classList.contains('open')) { if (currentTab === 'places') renderList(); else renderTrips(); }
    if (lb) renderLightbox();
  }

  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (e.key === 'Escape') {
      if (document.body.classList.contains('intro-on') && !$('overlay').classList.contains('open')) return closeIntro();
      if (game && !$('overlay').classList.contains('open')) return stopGame();
      if (frame) return stopFrame();
      if (lb) return closeLightbox();
      if ($('overlay').classList.contains('open')) return closeDialog();
      if ($('menu').classList.contains('open')) return closeMenu();
      if (placing) return cancelPlacing();
      if (play) return stopPlay();
      if ($('drawer').classList.contains('open')) return closeList();
      if (cardMode) return closeCard();
      return;
    }
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || $('overlay').classList.contains('open')) return;
    if (lb) { if (e.key === 'ArrowRight') lbStep(1); if (e.key === 'ArrowLeft') lbStep(-1); return; }
    if (play) { if (e.key === 'ArrowRight') playStep(1); if (e.key === 'ArrowLeft') playStep(-1); if (e.key === ' ') { e.preventDefault(); togglePlayPause(); } return; }
    if (e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); openGoto(); return; }
    if (e.key === 'ArrowRight') nextCity();
    if (e.key === 'ArrowLeft') prevCity();
  });
  document.addEventListener('visibilitychange', requestRender);
  window.addEventListener('resize', () => {
    requestRender();
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelData.forEach(l => l.w = 0);
  });

  // ═════════════════════════════════════════════════════════════════════
  //  BOUCLE
  // ═════════════════════════════════════════════════════════════════════
  // Sur mobile, quand une fiche est ouverte, on remonte le globe pour que le lieu reste visible au-dessus
  let viewShift = null;
  function updateViewOffset() {
    const want = window.innerWidth < 700 && (document.body.classList.contains('card-open') || document.body.classList.contains('gaming')) ? 'up' : 'none';
    const key = want + window.innerWidth + 'x' + window.innerHeight;
    if (key === viewShift) return;
    viewShift = key;
    const W = window.innerWidth, H = window.innerHeight;
    if (want === 'up') camera.setViewOffset(W, H, 0, H * 0.27, W, H); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    labelData.forEach(l => l.w = 0);
    requestRender();
  }
  // Rendu à la demande : le globe n'est redessiné que lorsqu'il bouge (économise batterie et processeur)
  let needsRender = true, lastFrame = 0, introAnim = false;
  function requestRender() { needsRender = true; }
  controls.addEventListener('change', requestRender);
  function animate(now) {
    requestAnimationFrame(animate);
    if (document.hidden) return;
    now = now || performance.now();
    if (LITE && lastFrame && now - lastFrame < 31) return;
    const dt = Math.min(0.1, (now - (lastFrame || now)) / 1000); lastFrame = now;
    updateViewOffset();
    const dist = camera.position.length();
    controls.rotateSpeed = 0.15 + 0.6 * (dist - R) / 14;
    let moving = camAnimId ? true : controls.update();
    if (arcAnims.length || introAnim) moving = true;
    if (!moving && !needsRender) return;
    needsRender = false;
    if (clouds.visible) clouds.rotation.y += dt * 0.006;
    if (globeStyle === 'satellite' && !realSun) updateSun();
    const s = Math.max(0.08, (dist - R) / 8);
    markers.children.forEach(pin => { const k = pin.userData.id === currentId ? 1.9 * s : s; pin.scale.set(k, k, k); });
    now = performance.now();
    arcAnims = arcAnims.filter(a => { const t = Math.min(1, (now - a.start) / a.dur); a.geo.setDrawRange(0, Math.floor(a.total * t / 3) * 3); return t < 1; });
    renderer.render(scene, camera);
    updateLabels();
  }

  // ═════════════════════════════════════════════════════════════════════
  //  DÉMARRAGE
  // ═════════════════════════════════════════════════════════════════════
  let booted = false;
  applyStatic();
  $('loading-text').textContent = L('Chargement de tes voyages…', 'Loading your travels…', {pt: `Carregando suas viagens…`, es: `Cargando tus viajes…`, it: `Caricamento dei tuoi viaggi…`, de: `Deine Reisen werden geladen …`});
  (async () => {
    animate();
    try { COUNTRIES = decodeWorld(await worldReady); }
    catch (e) { console.warn(e); $('loading-text').textContent = L('Impossible de charger la carte du monde. Vérifie ta connexion puis recharge la page.', "Couldn't load the world map. Check your connection and reload the page.", {pt: `Não foi possível carregar o mapa-múndi. Verifique sua conexão e recarregue a página.`, es: `No se pudo cargar el mapa del mundo. Comprueba tu conexión y recarga la página.`, it: `Impossibile caricare la mappa del mondo. Controlla la connessione e ricarica la pagina.`, de: `Die Weltkarte konnte nicht geladen werden. Prüfe deine Verbindung und lade die Seite neu.`}); }
    await Store.init();
    booted = true;
    realCanWrite = canWrite; realCanUpload = canUpload;
    if (mode === 'embedded') guest = false;
    applyGuest();
    updateBranding();
    document.body.classList.add('style-' + globeStyle);
    renderLegend();
    rebuildMarkers();
    drawEarth(true);
    updateStats(); updateCaption(); updateMenu();
    $('loading').classList.add('done');
    controls.autoRotate = true;
    initSync();
    if (mode === 'local' && !cities.length && !settings.welcomed) openWelcome();
    else if (shouldShowIntro()) openIntro();
    if (crashedLastTime && LITE) setTimeout(() => toast(L('⚡ Mode allégé activé pour ce téléphone (☰ Plus pour le changer)', '⚡ Light mode turned on for this phone (☰ More to change it)', {pt: `⚡ Modo leve ativado para este celular (☰ Mais para mudar)`, es: `⚡ Modo ligero activado para este móvil (☰ Más para cambiarlo)`, it: `⚡ Modalità leggera attivata per questo telefono (☰ Altro per cambiarla)`, de: `⚡ Leicht-Modus für dieses Handy aktiviert (☰ Mehr zum Ändern)`}), 6000), 1500);
    loadMusic();
    if (mode === 'cloud' && !cities.length && canWrite) toast(L('Ton carnet est vide : ajoute ton premier lieu avec ➕', 'Your journal is empty: add your first place with ➕', {pt: `Seu diário está vazio: adicione seu primeiro lugar com ➕`, es: `Tu diario está vacío: añade tu primer lugar con ➕`, it: `Il tuo diario è vuoto: aggiungi il primo luogo con ➕`, de: `Dein Tagebuch ist leer: Füge deinen ersten Ort mit ➕ hinzu`}), 5000);
  })();
  </script>
