<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" data-app>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-app>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carnet 3D">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Ton carnet de voyage sur un globe 3D : tes lieux, tes photos, tes voyages.">

  <title data-app>Mon Carnet de Voyage 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" data-app>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-app>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" data-app>
  <style data-app>
    :root {
      --ink: #1a1a1a; --muted: #6b6259; --paper: #fbf7f1;
      --green: #52b788; --green-dark: #2d6a4f; --red: #e63946; --orange: #ff8c00; --purple: #7b2cbf;
      --radius: 18px; --shadow: 0 10px 40px rgba(60, 40, 20, 0.18); --accent: #52b788;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, button, input, select, textarea { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at center, #f5e6d3 0%, #e6cbab 60%, #d8b892 100%);
      height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; color: #333;
      -webkit-tap-highlight-color: transparent; transition: background .6s;
    }
    body.style-nuit { background: radial-gradient(circle at center, #1b2440 0%, #0c1122 60%, #05070f 100%); }
    body.style-satellite { background: radial-gradient(circle at center, #2a3550 0%, #121a2e 65%, #070b16 100%); }
    html { overflow: hidden; height: 100%; }
    #app-root { position: fixed; inset: 0; overflow: hidden; }
    h1, h2, h3, .serif { font-family: "Fraunces", Georgia, serif; }
    button { cursor: pointer; }
    img.broken { visibility: hidden; }
    .hidden { display: none !important; }

    #canvas-container { position: absolute; inset: 0; z-index: 1; cursor: grab; touch-action: none; }
    #canvas-container:active { cursor: grabbing; }
    body.placing #canvas-container { cursor: crosshair; }

    /* ── En-tête ── */
    .header {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(10px);
      padding: 10px 18px 10px 14px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 12px; border: none; text-align: left; color: inherit;
    }
    .header:hover { background: #fff; }
    .header .globe-emoji { font-size: 1.5rem; }
    .header h1 { font-size: 1.12rem; font-weight: 700; color: var(--ink); }
    .header p { font-size: 0.78rem; color: #666; margin-top: 1px; }

    .top-actions { position: absolute; top: 20px; right: 20px; z-index: 12; display: flex; gap: 8px; }
    .btn {
      background: rgba(255,255,255,0.92); border: none; padding: 10px 16px; border-radius: 20px;
      font-weight: 600; font-size: 0.85rem; color: var(--ink); box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .btn:disabled { opacity: .55; cursor: wait; transform: none; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #333; }
    .btn-ghost { background: #f1f3f5; box-shadow: none; }
    .btn-ghost:hover { background: #e9ecef; box-shadow: none; }
    .btn-danger { background: #fdecee; color: #b42318; box-shadow: none; }
    .btn-danger:hover { background: #fbd9dd; box-shadow: none; }

    /* ── Menu « Plus » ── */
    .menu {
      position: absolute; top: 66px; right: 20px; z-index: 70; width: 300px; max-width: calc(100vw - 24px);
      background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
      display: none; flex-direction: column; gap: 2px; max-height: calc(100% - 90px); overflow-y: auto;
    }
    .menu.open { display: flex; }
    .menu button.mi {
      border: none; background: transparent; text-align: left; padding: 10px 12px; border-radius: 10px;
      font-size: .9rem; color: var(--ink); display: flex; gap: 10px; align-items: center;
    }
    .menu button.mi:hover { background: #efe8de; }
    .menu button.mi small { display: block; color: var(--muted); font-size: .74rem; font-weight: 400; }
    .menu .sep { height: 1px; background: #e7ded2; margin: 4px 6px; }
    .menu .style-row { display: flex; gap: 6px; padding: 6px 8px 8px; }
    .menu .style-row button { flex: 1; border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; font-size: .78rem; font-weight: 600; background: #efe8de; color: var(--ink); }
    .menu .style-row button.active { border-color: var(--ink); background: #fff; }
    .lang-switch { display: flex; background: rgba(255,255,255,0.92); border-radius: 20px; padding: 3px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    select.lang-switch { border: none; font: inherit; font-weight: 700; font-size: .78rem; padding: 0 10px; color: var(--ink); cursor: pointer; height: 36px; }
    .sync-state { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 10px; background: rgba(82,183,136,.15); color: #2d6a4f; font-weight: 600; cursor: pointer; }
    .sync-state.s-auth { background: #fff1db; color: #9a5b00; }
    .sync-state.s-error { background: #fde8e8; color: #b42318; }
    .sync-state.s-busy, .sync-state.s-pending { background: rgba(58,134,255,.12); color: #1d4ed8; }
    .lang-row { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px; }
    .lang-switch button { border: none; background: transparent; font-weight: 700; font-size: .78rem; padding: 0 10px; border-radius: 16px; color: #8a8077; }
    .lang-switch button.active { background: var(--ink); color: #fff; }
    .menu .menu-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #8a8077; padding: 8px 12px 2px; }

    /* ── Légende ── */
    .legend {
      position: absolute; left: 20px; bottom: 30px; z-index: 10;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      border-radius: 14px; padding: 10px 14px; font-size: 0.74rem; color: #444;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 5px;
    }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.1); }
    .pin-swatch { width: 9px; height: 9px; border-radius: 50%; margin: 0 2px; }

    /* ── Barre de navigation ── */
    .bottom-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .nav-pill { background: #1e2229; border-radius: 40px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
    .nav-btn {
      background: transparent; border: none; color: #fff; min-width: 38px; height: 38px; border-radius: 19px; padding: 0 10px;
      display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.95rem; font-weight: 600; transition: background .2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.15); }
    .nav-btn.play { background: var(--green); color: #10251b; font-size: 0.85rem; padding: 0 14px; }
    .nav-btn.play:hover { background: #63c796; }
    .footer-caption { font-size: 0.88rem; color: #4a3e35; font-weight: 500; font-style: italic; text-align: center; background: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 12px; }

    .filter-banner {
      position: absolute; z-index: 11; top: 84px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 7px 8px 7px 14px; border-radius: 18px; font-size: .84rem;
      display: none; align-items: center; gap: 10px; box-shadow: var(--shadow);
    }
    .filter-banner.show { display: flex; }
    .filter-banner button { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 12px; padding: 4px 10px; font-weight: 600; }

    /* ── Étiquettes ── */
    #labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    .city-tag {
      position: absolute; top: 0; left: 0; visibility: hidden; display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.93); color: var(--ink); padding: 2px 7px; border-radius: 11px;
      font-size: 11px; font-weight: 600; line-height: 14px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      pointer-events: auto; cursor: pointer; will-change: transform;
    }
    .city-tag.has-photo { padding-left: 2px; }
    .tag-thumb { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; background: #ddd; flex: none; }
    .city-tag.project { color: #b85c00; }
    .city-tag .more { display: none; margin-left: 2px; background: var(--accent, #2d6a4f); color: #fff; font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 8px; cursor: zoom-in; }
    .city-tag.current .more { background: #fff; color: var(--ink); }
    #pulse { position: absolute; top: 0; left: 0; z-index: 4; width: 0; height: 0; pointer-events: none; display: none; }
    #pulse::before, #pulse::after { content: ''; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent, #52b788); animation: pulse 2.2s ease-out infinite; opacity: 0; }
    #pulse::after { animation-delay: 1.1s; }
    @keyframes pulse { 0% { transform: scale(.35); opacity: .95; } 100% { transform: scale(1.9); opacity: 0; } }
    .city-tag.lived { color: var(--purple); }
    .city-tag.current { background: var(--ink); color: #fff; font-size: 12.5px; line-height: 16px; padding: 3px 9px; z-index: 2; }
    .city-tag.current.has-photo { padding-left: 3px; }
    .city-tag.current .tag-thumb { width: 22px; height: 22px; }
    body.style-nuit .city-tag:not(.current) { background: rgba(20,24,40,.85); color: #ffe7a8; box-shadow: 0 0 8px rgba(255,200,90,.25); }

    /* ── Fiche (lieu ou voyage) ── */
    .card {
      position: absolute; z-index: 40; right: 20px; top: 78px; width: 400px;
      max-height: calc(100% - 98px); overflow-y: auto; overscroll-behavior: contain;
      background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow);
      transform: translateX(calc(100% + 40px)); transition: transform .35s cubic-bezier(.16,1,.3,1);
    }
    .card.open { transform: translateX(0); }
    .card-cover {
      position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, #d8e9df, #f3e3c8);
      border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: #6b7f72; font-size: 0.9rem; text-align: center;
    }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-cover .empty-cover { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 20px; }
    .card-cover .empty-cover span { font-size: 2rem; }
    .card-cover .cover-badge { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 10px; }
    .card-close {
      position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.45); color: #fff; font-size: 1.2rem; z-index: 3; display: flex; align-items: center; justify-content: center;
    }
    .card-body { padding: 16px 18px 18px; }
    .card-title { display: flex; align-items: flex-start; gap: 8px; }
    .card-title h2 { font-size: 1.5rem; line-height: 1.15; color: var(--ink); flex: 1; word-break: break-word; }
    .card-nav { display: flex; gap: 4px; }
    .round-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: #efe8de; color: var(--ink); font-size: 1rem; display: flex; align-items: center; justify-content: center; flex: none; }
    .round-btn:hover { background: #e6dccf; }
    .card-sub { color: var(--muted); font-size: 0.86rem; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .chip-status { font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 12px; background: #fde8e9; color: #b42318; }
    .chip-status.project { background: #fff1db; color: #b85c00; }
    .chip-status.lived { background: #efe4fb; color: var(--purple); }
    .trip-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .trip-chip { border: none; background: #e3efe8; color: var(--green-dark); font-weight: 700; font-size: .78rem; padding: 5px 10px; border-radius: 12px; }
    .trip-chip:hover { background: #d3e8dc; }
    .trip-chip-wrap { display: inline-flex; align-items: stretch; border-radius: 12px; overflow: hidden; }
    .trip-chip-wrap .trip-chip { border-radius: 12px 0 0 12px; }
    .trip-chip-wrap .trip-chip:only-child { border-radius: 12px; }
    .trip-unlink { border: none; background: #d3e8dc; color: var(--green-dark); font-weight: 700; font-size: .75rem; padding: 0 9px; }
    .trip-unlink:hover { background: #e63946; color: #fff; }
    .stop .mv.unlink:hover { background: #e63946; color: #fff; }
    .people { margin-top: 8px; font-size: .86rem; color: #3a332c; }
    .people button { border: none; background: #f1e9de; border-radius: 10px; padding: 2px 8px; font-size: .8rem; font-weight: 600; color: var(--ink); margin: 2px 2px 0 0; }
    .card-note { margin-top: 12px; font-size: 0.92rem; line-height: 1.5; color: #3a332c; white-space: pre-wrap; word-break: break-word; }
    .card-note.placeholder { color: #a39a90; font-style: italic; }
    .section-title { margin: 16px 0 8px; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #8a8077; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .photo-grid .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #e8e0d4; border: none; padding: 0; cursor: pointer; }
    .photo-grid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
    .photo-grid .ph:hover img { transform: scale(1.05); }
    .photo-grid .ph .star { position: absolute; top: 4px; left: 4px; font-size: .8rem; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    .photo-grid .ph .vid { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .9rem; pointer-events: none; }
    .photo-grid .add-tile {
      aspect-ratio: 1; border-radius: 10px; border: 2px dashed #c9bdae; background: transparent; color: #8a7d6f;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .75rem; font-weight: 600;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .photo-grid .add-tile span { font-size: 1.4rem; }
    .photo-grid .add-tile:hover { background: #f1e9de; }
    .file-hit { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
    .ph-del {
      position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.6); color: #fff; font-size: .8rem; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s, background .15s;
    }
    .ph-del:hover { background: #e63946; }
    .photo-grid .ph:hover .ph-del, .photo-grid .ph:focus-within .ph-del { opacity: 1; }
    @media (hover: none) { .ph-del { opacity: 1; } }
    .card-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .card-actions .btn { flex: 1; padding: 10px; font-size: .82rem; }
    .upload-progress { margin-top: 10px; font-size: .82rem; color: var(--green-dark); font-weight: 600; }
    .stops { display: flex; flex-direction: column; gap: 6px; }
    .stop { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 8px 10px; }
    .stop .num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
    .stop .thumb { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; background: #ece4d8; flex: none; }
    .stop .meta { flex: 1; min-width: 0; cursor: pointer; }
    .stop strong { display: block; font-size: .9rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stop small { color: #8a8077; font-size: .74rem; }
    .stop .mv { width: 26px; height: 26px; border-radius: 8px; border: none; background: #efe8de; font-size: .8rem; }

    /* ── Tiroir liste ── */
    .drawer {
      position: absolute; top: 0; right: 0; width: 400px; max-width: 100vw; height: 100%;
      background: rgba(251,247,241,0.98); backdrop-filter: blur(15px); z-index: 60; box-shadow: -10px 0 30px rgba(0,0,0,0.12);
      transform: translateX(110%); transition: transform .3s cubic-bezier(.16,1,.3,1);
      padding: 20px 20px 16px; display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
    .tabs { display: flex; background: #efe8de; border-radius: 12px; padding: 3px; gap: 3px; flex: 1; }
    .tabs button { flex: 1; border: none; background: transparent; padding: 9px; border-radius: 9px; font-weight: 700; font-size: .88rem; color: #6b6259; }
    .tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .field { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #ddd3c6; background: #fff; font-size: 0.92rem; color: var(--ink); }
    .field:focus { outline: 2px solid var(--green); border-color: transparent; }
    textarea.field { resize: vertical; min-height: 110px; line-height: 1.45; }
    .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .chip { border: 1px solid #ddd3c6; background: #fff; border-radius: 16px; padding: 5px 12px; font-size: 0.78rem; color: var(--ink); }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .city-list { margin-top: 12px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 5px; padding-right: 2px; }
    .country-header { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #8a8077; margin-top: 10px; padding-left: 4px; }
    .country-header:first-child { margin-top: 0; }
    .city-item { padding: 7px 10px; border-radius: 12px; background: #fff; border: none; width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; color: var(--ink); transition: background .15s; }
    .city-item:hover { background: #f1e9de; }
    .city-item.current { outline: 2px solid var(--ink); }
    .city-item .thumb { width: 38px; height: 38px; border-radius: 9px; object-fit: cover; background: #ece4d8; flex: none; display: flex; align-items: center; justify-content: center; font-size: .9rem; }
    .city-item .meta { flex: 1; min-width: 0; }
    .city-item strong { display: block; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .city-item small { color: #8a8077; font-size: .75rem; }
    .trip-item { border: none; background: #fff; border-radius: 14px; overflow: hidden; text-align: left; padding: 0; width: 100%; display: flex; flex-direction: column; color: var(--ink); }
    .trip-item:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .trip-item .tc { aspect-ratio: 16/6; background: linear-gradient(135deg, #d8e9df, #f3e3c8); position: relative; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .trip-item .tc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .trip-item .ti { padding: 10px 12px; }
    .trip-item strong { font-family: "Fraunces", Georgia, serif; font-size: 1.08rem; display: block; }
    .trip-item small { color: #8a8077; font-size: .78rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }
    .dot.project { background: var(--orange); }
    .dot.lived { background: var(--purple); }
    .empty { color: #999; font-size: 0.86rem; text-align: center; margin-top: 24px; line-height: 1.45; }
    .list-footer { display: flex; gap: 8px; margin-top: 12px; }
    .list-footer .btn { flex: 1; font-size: .8rem; padding: 10px; }

    /* ── Dialogues ── */
    .overlay {
      position: absolute; inset: 0; z-index: 350; background: rgba(30,22,14,0.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

  let cities = [];   // {id,name,country,lat,lng,status,date,note,photos:[{id,thumb,poster,type,caption,takenAt}],cover,companions,createdAt}

  const Store = {
    db: null, assets: null, idb: null, memory: new Map(), urlCache: new Map(), writeChains: {},

    async init() {
      if (EMBEDDED) {
        mode = 'embedded'; canWrite = false; canUpload = false;
        cities = (EMBEDDED.cities || []).map(normalizeCity);
        trips = (EMBEDDED.trips || []).map(normalizeTrip);

    },

    subscribeCloud() {
      const db = this.db;
      db.collection('trips').onSnapshot(snap => {
        trips = snap.docs.map(d => normalizeTrip({ ...clone(d.data()), id: d.id }));
        sortAll(); if (booted) onDataChanged();
      }, () => {});
      db.doc('settings/main').onSnapshot(snap => {
        const prevMusic = settings.music && settings.music.id;

        if ((settings.music && settings.music.id) !== prevMusic) loadMusic();

      }, () => {});
      return new Promise(resolve => {
        let first = true;
        const timer = setTimeout(() => {
          if (first) { first = false; resolve(); }
          toast(L("Tes voyages mettent du temps à se charger… vérifie ta connexion.", "Your travels are taking a while to load… check your connection.", {pt: `Suas viagens estão demorando para carregar… verifique sua conexão.`, es: `Tus viajes tardan en cargar… comprueba tu conexión.`, it: `I tuoi viaggi ci mettono un po' a caricarsi… controlla la connessione.`, de: `Deine Reisen laden langsam … prüfe deine Verbindung.`}), 5000);
        }, 10000);
        db.collection('cities').onSnapshot(snap => {
          if (!snap.metadata.fromCache) clearTimeout(timer);

    async initLocal() {

    async kvGet(k) {

    async kvSet(k, v) {

    async kvDel(k) {

    saveCity(city) {

    },
    saveSettings(s) {

      s.updatedAt = Date.now(); markChanged('s');

    },
    replaceAll(list, tripList) {
      const oldC = cities.slice(), oldT = trips.slice();
      cities = list; trips = tripList || []; sortAll(); onDataChanged();
      if (mode === 'cloud') {
        return (async () => {
          for (const c of oldC) if (!list.some(n => n.id === c.id)) await this.queue(c.id, () => this.db.doc('cities/' + c.id).delete());
          for (const t of oldT) if (!trips.some(n => n.id === t.id)) await this.queue('t' + t.id, () => this.db.doc('trips/' + t.id).delete());

          for (const t of trips) { const b = clone(t); delete b.id; await this.queue('t' + t.id, () => this.db.doc('trips/' + t.id).set(b)); }

    // Fichiers (photos, vidéos, musique) → identifiant
    async upload(blob, type) {

          try { return (await this.assets.upload(blob, { type })).id; }

        }

    },
    async removeFile(id) {

    },
    async deleteMedia(p) { for (const k of [p.id, p.thumb, p.mini, p.poster]) await this.removeFile(k); },
    async src(id) {

  function ll2v(lat, lng, r) {

  function photoTexture(kind) {

  function countrySets() {

  function renderLegend() {

  // ── Arcs ──
  const arcs = new THREE.Group();
  scene.add(arcs);
  const arcMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).convertSRGBToLinear(), transparent: true, opacity: 0.9 });
  const routeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffd166).convertSRGBToLinear(), transparent: true, opacity: 0.95 });
  let arcAnims = [];
  function drawArc(a, b, mat = arcMat, dur = 1500, radius = 0.012) {
    const va = ll2v(a.lat, a.lng, 1), vb = ll2v(b.lat, b.lng, 1);
    const angle = va.angleTo(vb);
    if (angle < 0.002) return;
    const lift = Math.min(0.85, 0.06 + angle * 0.32);
    const pts = [];
    const q = new THREE.Quaternion().setFromUnitVectors(va, vb), qi = new THREE.Quaternion(), qs = new THREE.Quaternion();
    for (let i = 0; i <= 64; i++) { const t = i / 64; qs.copy(qi).slerp(q, t); pts.push(va.clone().applyQuaternion(qs).multiplyScalar(R + 0.03 + Math.sin(Math.PI * t) * lift)); }
    const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, radius, 6, false);
    arcs.add(new THREE.Mesh(geo, mat));
    if (dur > 0) { geo.setDrawRange(0, 0); arcAnims.push({ geo, total: geo.index.count, start: performance.now(), dur }); }
  }
  function clearArcs() { arcs.children.slice().forEach(m => { m.geometry.dispose(); arcs.remove(m); }); arcAnims = []; }

  // ═════════════════════════════════════════════════════════════════════
  //  CAMÉRA
  // ═════════════════════════════════════════════════════════════════════
  let camAnimId = null;
  function flyTo(lat, lng, dist, duration = 1200) {
    return new Promise(resolve => {
      const startLen = camera.position.length();
      const endLen = dist || Math.min(Math.max(startLen, 6), 12);
      const startDir = camera.position.clone().normalize();
      const endDir = ll2v(lat, lng, 1).normalize();
      const q = new THREE.Quaternion().setFromUnitVectors(startDir, endDir), qi = new THREE.Quaternion(), qs = new THREE.Quaternion();
      const hopMax = Math.min(3, startDir.angleTo(endDir) * 1.5);
      const t0 = performance.now();
      if (camAnimId) cancelAnimationFrame(camAnimId);
      const step = now => {
        const t = Math.min((now - t0) / duration, 1);
        const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        qs.copy(qi).slerp(q, e);
        camera.position.copy(startDir).applyQuaternion(qs).multiplyScalar(startLen + (endLen - startLen) * e + Math.sin(Math.PI * e) * hopMax);
        camera.lookAt(0, 0, 0);
        if (t < 1) camAnimId = requestAnimationFrame(step); else { camAnimId = null; resolve(); }
      };
      camAnimId = requestAnimationFrame(step);
    });
  }
  function flyToFit(list, duration) {
    if (!list.length) return;
    const sum = new THREE.Vector3();
    list.forEach(c => sum.add(ll2v(c.lat, c.lng, 1)));
    if (sum.length() < 1e-6) sum.set(0, 0, 1);
    sum.normalize();
    let spread = 0;
    list.forEach(c => { spread = Math.max(spread, sum.angleTo(ll2v(c.lat, c.lng, 1))); });
    const ll = v2ll(sum);
    return flyTo(ll.lat, ll.lng, Math.min(16, Math.max(5.8, 5.6 + spread * 9)), duration || 1400);
  }

  let autoRotateEnabled = true, idleTimer = null;
  function pauseAutoRotate() {
    controls.autoRotate = false;
    clearTimeout(idleTimer);
    if (autoRotateEnabled && !play && !frame && !game) idleTimer = setTimeout(() => { if (!play && !frame && !cardMode && !game) controls.autoRotate = true; }, 12000);
  }
  function toggleAutoRotate() {

  const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  let downPos = null;
  renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (frame) return;
    if (!downPos || Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
    pointer.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    if (game) { if (game.phase === 'guess') { const gh = raycaster.intersectObject(globe); if (gh.length) gameGuess(v2ll(gh[0].point)); } return; }
    if (document.body.classList.contains('intro-on')) { closeIntro(); return; }
    const hits = raycaster.intersectObjects([globe, ...markers.children]);
    if (!hits.length) return;
    if (placing) { const g = hits.find(h => h.object === globe); finishPlacing(v2ll(g ? g.point : hits[0].point)); return; }
    if (hits[0].object !== globe) selectCity(hits[0].object.userData.id);
    closeMenu();
  });

  // EXIF : date de prise de vue + position GPS
  async function readExif(file) {
    const res = { date: null, lat: null, lng: null };
    try {
      const v = new DataView(await file.slice(0, 512 * 1024).arrayBuffer());
      if (v.getUint16(0) !== 0xFFD8) return res;
      let off = 2;
      while (off < v.byteLength - 10) {
        const marker = v.getUint16(off), size = v.getUint16(off + 2);
        if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
          const t = off + 10, le = v.getUint16(t) === 0x4949;
          const g16 = o => v.getUint16(t + o, le), g32 = o => v.getUint32(t + o, le);
          const ifd = o => { const n = g16(o), e = {}; for (let i = 0; i < n; i++) { const p = o + 2 + i * 12; e[g16(p)] = { count: g32(p + 4), at: p + 8 }; } return e; };
          const ascii = en => { const o = en.count > 4 ? g32(en.at) : en.at; let s = ''; for (let i = 0; i < en.count - 1; i++) s += String.fromCharCode(v.getUint8(t + o + i)); return s; };
          const rat = o => { const n = g32(o), d = g32(o + 4); return d ? n / d : 0; };
          const i0 = ifd(g32(4));
          let dt = null;
          if (i0[0x8769]) { const ex = ifd(g32(i0[0x8769].at)); if (ex[0x9003]) dt = ascii(ex[0x9003]); }
          if (!dt && i0[0x0132]) dt = ascii(i0[0x0132]);
          const m = dt && dt.match(/^(\d{4}):(\d{2}):(\d{2})/);
          if (m && m[1] !== '0000') res.date = `${m[1]}-${m[2]}-${m[3]}`;
          if (i0[0x8825]) {
            const g = ifd(g32(i0[0x8825].at));
            const coord = en => { const o = g32(en.at); return rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600; };
            const ref = en => String.fromCharCode(v.getUint8(t + en.at));
            if (g[2] && g[4]) {
              let lat = coord(g[2]), lng = coord(g[4]);
              if (g[1] && ref(g[1]) === 'S') lat = -lat;
              if (g[3] && ref(g[3]) === 'W') lng = -lng;
              if (isFinite(lat) && isFinite(lng) && !(lat === 0 && lng === 0) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) { res.lat = lat; res.lng = lng; }
            }
          }
          return res;
        }
        if ((marker & 0xFF00) !== 0xFF00) break;
        off += 2 + size;
      }
    } catch (e) {}
    return res;
  }

  let cityIndex = null, cityIndexP = null;
  function ensureCityIndex() {
    if (cityIndex) return Promise.resolve(cityIndex);
    if (!cityIndexP) cityIndexP = assetText('cities').then(txt => {
      cityIndex = txt.split('\n').map(l => { const [n, c, la, ln, p] = l.split('|'); return { n, c, la: +la, ln: +ln, p: +p, k: norm(n) }; });
      return cityIndex;
    }).catch(e => { cityIndexP = null; throw e; });
    return cityIndexP;
  }
  function searchPlaces(query) {
    if (!cityIndex) return [];
    let [q, cq] = query.split(',').map(s => norm(s));
    if (!q || q.length < 2) return [];
    const countryOk = r => !cq || norm(countryName(r.c)).startsWith(cq) || r.c.toLowerCase() === cq;
    const out = [], seen = new Set();
    const push = (r, display) => { const key = r.n + r.c + r.la; if (seen.has(key) || !countryOk(r)) return; seen.add(key); out.push({ ...r, display: display || r.n }); };
    if (LANG === 'fr') for (const [fr, target] of Object.entries(FR_ALIASES)) {
      if (fr.startsWith(q) && (q.length >= 3 || fr === q)) {
        const tk = norm(target), r = cityIndex.find(x => x.k === tk);
        if (r) push(r, fr.replace(/(^|[\s-])\S/g, s => s.toUpperCase()));
      }
    }
    for (const r of cityIndex) { if (out.length >= 10) break; if (r.k.startsWith(q)) push(r); }
    if (out.length < 10) for (const r of cityIndex) { if (out.length >= 10) break; if (r.k.includes(' ' + q) || r.k.includes('-' + q)) push(r); }
    return out.slice(0, 10);
  }
  function nearestKnownCity(lat, lng) {
    if (!cityIndex) return null;
    let best = null, bestD = Infinity;
    const cosLat = Math.cos(lat * Math.PI / 180);
    for (const r of cityIndex) {
      const dx = (r.ln - lng) * cosLat, dy = r.la - lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = r; }
    }
    return best ? { ...best, km: distanceKm({ lat, lng }, { lat: best.la, lng: best.ln }) } : null;
  }

  let importGroups = null;
  async function analysePhotos(e) {
    try { await ensureCityIndex(); } catch (err) {}
    const files = [...(e.target.files || [])];
    if (!files.length) return;
    const zone = $('imp-zone');
    zone.innerHTML = `<p class="hint">${L('Lecture des photos…', 'Reading photos…', {pt: `Lendo as fotos…`, es: `Leyendo las fotos…`, it: `Lettura delle foto…`, de: `Fotos werden gelesen …`})} <span id="imp-n">0</span>/${files.length}</p><div class="progress"><i id="imp-bar"></i></div>`;
    const items = [];
    for (let i = 0; i < files.length; i++) {
      items.push({ file: files[i], exif: await readExif(files[i]) });
      if (i % 5 === 0 || i === files.length - 1) { $('imp-n').textContent = i + 1; $('imp-bar').style.width = ((i + 1) / files.length * 100) + '%'; await sleep(0); }
    }
    // Regroupement par lieu
    const groups = new Map();
    const noGps = [];
    for (const it of items) {
      if (it.exif.lat === null) { noGps.push(it); continue; }
      let key, g;
      const near = cities.map(c => ({ c, km: distanceKm(it.exif, c) })).sort((a, b) => a.km - b.km)[0];
      if (near && near.km < 25) {
        key = 'city:' + near.c.id;
        g = groups.get(key) || { key, existing: near.c, name: near.c.name, country: near.c.country, lat: near.c.lat, lng: near.c.lng, items: [] };
      } else {
        const k = nearestKnownCity(it.exif.lat, it.exif.lng);
        if (k && k.km < 40) {
          key = 'db:' + k.n + '|' + k.c;
          const alias = LANG === 'fr' && Object.entries(FR_ALIASES).find(([, t]) => norm(t) === k.k);
          g = groups.get(key) || { key, name: alias ? alias[0].replace(/(^|[\s-])\S/g, s => s.toUpperCase()) : k.n, country: k.c, lat: k.la, lng: k.ln, items: [] };
        } else {
          key = 'pt:' + Math.round(it.exif.lat * 5) + ',' + Math.round(it.exif.lng * 5);
          g = groups.get(key) || { key, name: '', country: countryAt(it.exif.lat, it.exif.lng), lat: +it.exif.lat.toFixed(4), lng: +it.exif.lng.toFixed(4), items: [] };
        }
      }
      g.items.push(it);
      groups.set(key, g);
    }
    importGroups = { list: [...groups.values()], noGps };
    importGroups.list.forEach(g => {
      const ds = g.items.map(i => i.exif.date).filter(Boolean).sort();
      g.first = ds[0] || ''; g.last = ds[ds.length - 1] || '';
      g.include = true;
    });
    importGroups.list.sort((a, b) => (a.first || '9').localeCompare(b.first || '9'));
    renderImportReview();
  }

  // Regroupe les lieux par périodes : plus de 10 jours sans photo = nouveau voyage
  function importPeriods(groups) {
    const dated = groups.filter(g => g.first).sort((a, b) => a.first.localeCompare(b.first));
    const day = s => new Date(s.slice(0, 10) + (s.length <= 7 ? '-01' : '')).getTime() / 864e5;
    const out = [];
    for (const g of dated) {
      const p = out[out.length - 1];
      if (p && day(g.first) - p.lastDay <= 10) { p.groups.push(g); p.lastDay = Math.max(p.lastDay, day(g.last || g.first)); p.last = g.last > p.last ? g.last : p.last; }
      else out.push({ groups: [g], first: g.first, last: g.last || g.first, lastDay: day(g.last || g.first) });
    }
    out.forEach(p => {
      const cs = [...new Set(p.groups.map(g => countryName(g.country)))];
      p.name = cs.slice(0, 2).join(' & ') + ' · ' + formatDate(p.first.slice(0, 7));
    });
    return out;
  }

    let done = 0, failed = 0, lastError = '';

    for (let gi = 0; gi < jobs.length; gi++) {

      let city = g.existing ? clone(byId(g.existing.id)) : normalizeCity({ id: uid(), name: g.name.trim(), country: g.country, lat: g.lat, lng: g.lng, status: 'visited', createdAt: baseCreated + gi });
      const added = [];

  // ═════════════════════════════════════════════════════════════════════
  //  VISITE GUIDÉE / REVIVRE UN VOYAGE (diaporama en « scènes »)
  // ═════════════════════════════════════════════════════════════════════
  let play = null;
  function playOrder(tripId) {
    if (tripId) { const t = tripById(tripId); return t ? tripCities(t).map(c => c.id) : []; }
    const v = visibleCities().filter(isBeen);
    const dated = v.filter(c => c.date).sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
    return dated.concat(v.filter(c => !c.date)).map(c => c.id);
  }
  // Visite guidée : statistiques → chaque voyage (titre + étapes) → autres escales → fin
  function buildTour() {
    const steps = [{ k: 'stats' }];
    const used = new Set();
    const tl = trips.slice().sort((a, b) => (a.start || '9').localeCompare(b.start || '9')).filter(t => tripCities(t).some(isBeen));
    for (const t of tl) {
      const ids = tripCities(t).filter(c => isBeen(c) && visibleCities().includes(c)).map(c => c.id);
      if (!ids.length) continue;
      steps.push({ k: 'trip', id: t.id });
      ids.forEach(id => { steps.push({ k: 'place', id }); used.add(id); });
    }
    const rest = visibleCities().filter(c => isBeen(c) && !used.has(c.id) && (c.photos.length || c.note))
      .sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || a.createdAt - b.createdAt);
    if (rest.length) {
      if (tl.length) steps.push({ k: 'title', kicker: '✈️', title: L('Autres escales', 'Other stops', {pt: `Outras paradas`, es: `Otras paradas`, it: `Altre tappe`, de: `Weitere Stationen`}), sub: plural(rest.length, 'lieu', 'lieux', 'place', 'places', {pt: [`lugar`, `lugares`], es: [`lugar`, `lugares`], it: [`luogo`, `luoghi`], de: [`Ort`, `Orte`]}) });
      rest.forEach(c => steps.push({ k: 'place', id: c.id }));
    }
    if (!steps.some(s => s.k === 'place')) playOrder().forEach(id => steps.push({ k: 'place', id }));
    steps.push({ k: 'end' });
    return steps;
  }
  function startTour() { startPlayer(buildTour(), null); }
  function startPlay(tripId) {
    if (!tripId) return startTour();
    const ids = playOrder(tripId);
    if (!ids.length) { toast(L("Aucun lieu visité à revivre pour l'instant.", 'No visited places to relive yet.', {pt: `Nenhum lugar visitado para reviver ainda.`, es: `Aún no hay lugares visitados que revivir.`, it: `Ancora nessun luogo visitato da rivivere.`, de: `Noch keine besuchten Orte zum Nacherleben.`})); return; }
    startPlayer([{ k: 'trip', id: tripId }, ...ids.map(id => ({ k: 'place', id })), { k: 'end', tripId }], tripId);
  }
  function startPlayer(steps, tripId) {
    if (!steps.some(s => s.k === 'place')) { toast(L("Aucun lieu visité à revivre pour l'instant.", 'No visited places to relive yet.', {pt: `Nenhum lugar visitado para reviver ainda.`, es: `Aún no hay lugares visitados que revivir.`, it: `Ancora nessun luogo visitato da rivivere.`, de: `Noch keine besuchten Orte zum Nacherleben.`})); return; }
    if (frame) stopFrame();
    if (game) stopGame();
    closeList(); closeDialog(); closeMenu(); closeIntro(true);

    controls.autoRotate = false; clearTimeout(idleTimer);
    clearArcs();
    document.body.classList.add('playing');
    const t = tripId && tripById(tripId);
    $('player-title').textContent = t ? '🧳 ' + t.name : appTitle();
    $('player-title').classList.add('show');
    $('music-btn').textContent = musicOn ? '🔊' : '🔇';
    play = { list: steps, i: -1, paused: false, timer: null, slide: null, token: 0, started: 0, remaining: 0, tripId };
    $('play-pause').textContent = '⏸';
    startMusic();
    playStep(1);
  }
  function hideScene() { $('scene').classList.remove('show'); }
  function showScene(kicker, title, sub, statsHtml) {

  }
  function animateCount(el, to, ms) {
    const t0 = performance.now();
    const tick = now => { const k = Math.min(1, (now - t0) / ms); el.textContent = fmtNum(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); };

  function statsTiles() {

    return tile(v.length, L('lieux', 'places', {pt: `lugares`, es: `lugares`, it: `luoghi`, de: `Orte`})) + tile(cs.length, L('pays', 'countries', {pt: `países`, es: `países`, it: `paesi`, de: `Länder`})) + tile(conts, L('continents', 'continents', {pt: `continentes`, es: `continentes`, it: `continenti`, de: `Kontinente`})) + (media ? tile(media, L('souvenirs', 'memories', {pt: `lembranças`, es: `recuerdos`, it: `ricordi`, de: `Erinnerungen`})) : '');
  }
  async function playStep(d) {
    if (!play) return;

    if (ni < 0) return;
    if (ni >= play.list.length) { stopPlay(true); return; }
    const prevPlace = d > 0 ? play.list.slice(0, ni).reverse().find(s => s.k === 'place') : null;
    play.i = ni;

    if (step.k === 'trip') {

      const people = [...new Set(list.flatMap(c => c.companions))];
      showScene('🧳 ' + L('Voyage', 'Trip', {pt: `Viagem`, es: `Viaje`, it: `Viaggio`, de: `Reise`}), t.name, [tripRange(t), plural(list.length, 'étape', 'étapes', 'stop', 'stops', {pt: [`parada`, `paradas`], es: [`parada`, `paradas`], it: [`tappa`, `tappe`], de: [`Station`, `Stationen`]}), people.length ? L('avec ', 'with ', {pt: `com `, es: `con `, it: `con `, de: `mit `}) + people.join(', ') : ''].filter(Boolean).join(' · '));
      flyToFit(list, 2000);
      drawTripRoute(t);
      return schedulePlayNext(4200);
    }
    if (step.k === 'title') { showScene(step.kicker, step.title, step.sub); return schedulePlayNext(3200); }
    if (step.k === 'end') {
      const v = cities.filter(isBeen), t = step.tripId && tripById(step.tripId);
      showScene('✈️', t ? L('Fin du voyage', 'End of the trip', {pt: `Fim da viagem`, es: `Fin del viaje`, it: `Fine del viaggio`, de: `Ende der Reise`}) : L('À suivre…', 'To be continued…', {pt: `Continua…`, es: `Continuará…`, it: `Continua…`, de: `Fortsetzung folgt …`}), t ? t.name : [plural(new Set(v.map(c => c.country)).size, 'pays', 'pays', 'country', 'countries', {pt: [`país`, `países`], es: [`país`, `países`], it: [`paese`, `paesi`], de: [`Land`, `Länder`]}), plural(v.length, 'lieu', 'lieux', 'place', 'places', {pt: [`lugar`, `lugares`], es: [`lugar`, `lugares`], it: [`luogo`, `luoghi`], de: [`Ort`, `Orte`]})].join(' · '));
      if (!t) flyTo(42, 10, 13, 2500);
      return schedulePlayNext(5200);
    }
    const c = byId(step.id);
    if (!c) { playStep(d || 1); return; }
    currentId = c.id; highlightCurrent();
    const prev = prevPlace && byId(prevPlace.id);
    if (prev) drawArc(prev, c);
    await flyTo(c.lat, c.lng, 8.5, prev ? Math.min(2600, 1300 + distanceKm(prev, c) / 6) : 1500);
    if (!play || token !== play.token) return;

    const n = Math.min(c.photos.length, 6);

  function schedulePlayNext(ms) {

  function endPlay() {

  let frame = null;
  async function startFrame() {
    if (play) stopPlay();

    if (cardMode) closeCard();
    try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    let wake = null;
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    document.body.classList.add('framing');
    frame = { timer: null, last: null, side: 'left', wake, t0: performance.now() };
    controls.autoRotate = true; controls.autoRotateSpeed = 0.25;
    $('frame-hint').classList.add('show');
    setTimeout(() => $('frame-hint').classList.remove('show'), 3500);
    startMusic();
    frameNext();
  }
  function framePool() {
    const pool = [];
    visibleCities().filter(isBeen).forEach(c => c.photos.forEach(p => pool.push({ c, p })));
    return pool;
  }
  async function frameNext() {
    if (!frame) return;
    const pool = framePool();
    const card = $('frame-card');
    card.classList.remove('show');
    if (!pool.length) {
      const l = visibleCities().filter(isBeen);
      if (l.length) { const c = l[Math.floor(Math.random() * l.length)]; currentId = c.id; highlightCurrent(); await flyTo(c.lat, c.lng, 9, 3000); }
      frame.timer = setTimeout(frameNext, 8000);
      return;
    }
    let pick;
    do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && frame.last && pick.p.id === frame.last);
    frame.last = pick.p.id;
    await sleep(700);
    if (!frame) return;
    controls.autoRotate = false;
    await flyTo(pick.c.lat, pick.c.lng, 9, 2600);
    if (!frame) return;
    controls.autoRotate = true;
    frame.side = frame.side === 'left' ? 'right' : 'left';
    card.className = 'frame-card ' + frame.side;
    $('fc-photo').innerHTML = `<img data-pid="${esc(fullImgId(pick.p))}" alt="">`;
    hydrate($('fc-photo'));
    $('fc-title').textContent = pick.c.name;
    $('fc-sub').textContent = [countryName(pick.c.country), formatDate(pick.p.takenAt || pick.c.date), pick.p.caption].filter(Boolean).join(' · ');
    requestAnimationFrame(() => card.classList.add('show'));
    frame.timer = setTimeout(frameNext, 9500);
  }
  function stopFrame() {
    if (!frame) return;
    clearTimeout(frame.timer);
    try { if (frame.wake) frame.wake.release(); } catch (e) {}
    frame = null;
    document.body.classList.remove('framing');
    $('frame-card').classList.remove('show');
    controls.autoRotateSpeed = 0.35;
    stopMusic();
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    currentId = null; highlightCurrent();
    pauseAutoRotate();
  }
  document.addEventListener('pointerdown', e => { if (frame && performance.now() - frame.t0 > 800) { e.preventDefault(); stopFrame(); } }, true);

      const pages = [];

      {

        ctx.fillText(`${plural(v.length, 'lieu', 'lieux', 'place', 'places', {pt: [`lugar`, `lugares`], es: [`lugar`, `lugares`], it: [`luogo`, `luoghi`], de: [`Ort`, `Orte`]})} · ${plural(new Set(v.map(x => x.country)).size, 'pays', 'pays', 'country', 'countries', {pt: [`país`, `países`], es: [`país`, `países`], it: [`paese`, `paesi`], de: [`Land`, `Länder`]})} · ${plural(trips.length, 'voyage', 'voyages', 'trip', 'trips', {pt: [`viagem`, `viagens`], es: [`viaje`, `viajes`], it: [`viaggio`, `viaggi`], de: [`Reise`, `Reisen`]})}`, PW / 2, 470);

      }

      if (withStats) {
        const { c, ctx } = newPage();
        const v = cities.filter(isBeen), countries = [...new Set(v.map(x => x.country))];
        ctx.fillStyle = INK; ctx.font = '700 70px Fraunces, Georgia, serif'; ctx.fillText(L('En chiffres', 'In numbers', {pt: `Em números`, es: `En cifras`, it: `In cifre`, de: `In Zahlen`}), MG, 200);
        const nums = [[v.length, L('lieux', 'places', {pt: `lugares`, es: `lugares`, it: `luoghi`, de: `Orte`})], [countries.length, L('pays', 'countries', {pt: `países`, es: `países`, it: `paesi`, de: `Länder`})], [new Set(countries.map(cc => CONTINENT[cc]).filter(k => k && k !== 'AN')).size, L('continents', 'continents', {pt: `continentes`, es: `continentes`, it: `continenti`, de: `Kontinente`})], [cities.reduce((s, x) => s + x.photos.length, 0), L('souvenirs', 'memories', {pt: `lembranças`, es: `recuerdos`, it: `ricordi`, de: `Erinnerungen`})]];
        nums.forEach(([n, l], i) => {
          const x = MG + (i % 2) * 540, y = 290 + Math.floor(i / 2) * 230;
          ctx.fillStyle = '#fff'; ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(x, y, 508, 200, 24) : ctx.rect(x, y, 508, 200)); ctx.fill();
          ctx.fillStyle = INK; ctx.font = '700 90px Fraunces, Georgia, serif'; ctx.fillText(String(n), x + 36, y + 115);
          ctx.fillStyle = MUTED; ctx.font = '500 32px Inter, sans-serif'; ctx.fillText(l, x + 40, y + 165);
        });
        let y = 800;
        ['EU', 'AS', 'AF', 'NA', 'SA', 'OC'].forEach(k => {

          ctx.fillStyle = INK; ctx.font = '400 28px Inter, sans-serif';
          const lines = wrapLines(ctx, cs.join(' · '), PW - 2 * MG);

        const imgs = [];

        let { c, ctx } = newPage();
        ctx.fillStyle = INK; ctx.font = '700 72px Fraunces, Georgia, serif';
        const tl = wrapLines(ctx, city.name, PW - 2 * MG).slice(0, 2);
        tl.forEach((l, i) => ctx.fillText(l, MG, 190 + i * 84));
        let y = 190 + (tl.length - 1) * 84 + 58;
        ctx.fillStyle = MUTED; ctx.font = '500 30px Inter, sans-serif';

        y += 40;
        ctx.font = '400 30px Inter, sans-serif'; ctx.fillStyle = '#3a332c';
        let noteLines = city.note ? wrapLines(ctx, city.note, PW - 2 * MG) : [];
        const maxNote = imgs.length ? 9 : 30;
        const shown = noteLines.slice(0, maxNote), rest = noteLines.slice(maxNote);

        const areaH = PH - 140 - y, W = PW - 2 * MG, gap = 18;

          : n === 4 ? [[0, 0, (W - gap) / 2, (areaH - gap) / 2], [(W + gap) / 2, 0, (W - gap) / 2, (areaH - gap) / 2], [0, (areaH + gap) / 2, (W - gap) / 2, (areaH - gap) / 2], [(W + gap) / 2, (areaH + gap) / 2, (W - gap) / 2, (areaH - gap) / 2]] : [];
        first.forEach((it, i) => { const [bx, by, bw, bh] = boxes[i]; drawCover(ctx, it.img, MG + bx, y + by, bw, bh); });

        ctx.font = '400 30px Inter, sans-serif'; ctx.fillStyle = '#3a332c';

        list.slice(0, 12).forEach((x, i) => { if (y + i * 44 < PH - 150) ctx.fillText(`${i + 1}.  ${x.name}  —  ${countryName(x.country)}`, MG, y + i * 44); });

  async function onAvatarPicked(e) {

      const img = await loadImage(f);
      const size = 320, c = document.createElement('canvas'); c.width = c.height = size;
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, m = Math.min(w, h);
      c.getContext('2d').drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, size, size);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
      const id = await Store.upload(blob, 'image/jpeg');
      const old = settings.avatar;
      await Store.saveSettings({ ...settings, avatar: id });
      if (old) Store.removeFile(old);
      updateBranding();
      openSettingsDialog();
    } catch (err) { toast(L("La photo n'a pas pu être enregistrée.", "The photo couldn't be saved.", {pt: `Não foi possível salvar a foto.`, es: `No se pudo guardar la foto.`, it: `Impossibile salvare la foto.`, de: `Das Foto konnte nicht gespeichert werden.`})); }

  function openGoto() {
    closeMenu(); closeList();

      <h2>🔎 ${L('Aller à…', 'Go to…', {pt: `Ir para…`, es: `Ir a…`, it: `Vai a…`, de: `Gehe zu …`})}</h2>
      <input class="field" id="goto-q" placeholder="${L('Un lieu, un pays, un voyage…', 'A place, a country, a trip…', {pt: `Um lugar, um país, uma viagem…`, es: `Un lugar, un país, un viaje…`, it: `Un luogo, un paese, un viaggio…`, de: `Ein Ort, ein Land, eine Reise …`})}" autocomplete="off">
      <div class="results" id="goto-res"></div>`);
    const input = $('goto-q');
    let items = [], kbd = 0;
    const run = () => {
      const q = norm(input.value);
      const tr = trips.filter(t => !q || norm(t.name).includes(q)).slice(0, 5).map(t => ({ kind: 'trip', id: t.id, label: '🧳 ' + t.name, sub: tripRange(t) }));
      const byC = new Map();
      cities.forEach(c => { const n = countryName(c.country); if (q && norm(n).includes(q)) byC.set(c.country, (byC.get(c.country) || 0) + 1); });
      const co = [...byC.entries()].slice(0, 4).map(([cc, n]) => ({ kind: 'country', id: cc, label: '🏳️ ' + countryName(cc), sub: plural(n, 'lieu', 'lieux', 'place', 'places', {pt: [`lugar`, `lugares`], es: [`lugar`, `lugares`], it: [`luogo`, `luoghi`], de: [`Ort`, `Orte`]}) }));
      const pl = cities.filter(c => !q || norm(c.name).includes(q)).sort((a, b) => (norm(a.name).startsWith(q) ? 0 : 1) - (norm(b.name).startsWith(q) ? 0 : 1) || a.name.localeCompare(b.name, collator()))
        .slice(0, q ? 10 : 8).map(c => ({ kind: 'place', id: c.id, label: STATUS[c.status].emoji + ' ' + c.name, sub: countryName(c.country) + (c.photos.length ? ' · 📷 ' + c.photos.length : '') }));
      items = [...co, ...tr, ...pl];
      kbd = Math.min(kbd, Math.max(0, items.length - 1));
      $('goto-res').innerHTML = items.length ? items.map((it, i) => `<button class="result ${i === kbd ? 'kbd' : ''}" data-i="${i}"><span>${esc(it.label)}</span><small>${esc(it.sub || '')}</small></button>`).join('') : `<div class="empty">${L('Aucun résultat.', 'No results.', {pt: `Nenhum resultado.`, es: `Sin resultados.`, it: `Nessun risultato.`, de: `Keine Ergebnisse.`})}</div>`;
      $('goto-res').querySelectorAll('.result').forEach(b => b.onclick = () => go(items[+b.dataset.i]));
    };
    const go = it => {
      if (!it) return;
      closeDialog();
      if (it.kind === 'trip') openTrip(it.id);
      else if (it.kind === 'country') { const l = cities.filter(c => c.country === it.id); if (cardMode) closeCard(); controls.autoRotate = false; clearTimeout(idleTimer); flyToFit(l, 1500); }
      else selectCity(it.id);
    };
    input.oninput = () => { kbd = 0; run(); };
    input.onkeydown = e => {
      if (e.key === 'ArrowDown') { kbd = Math.min(items.length - 1, kbd + 1); run(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { kbd = Math.max(0, kbd - 1); run(); e.preventDefault(); }
      if (e.key === 'Enter') go(items[kbd]);

    run();
    setTimeout(() => input.focus(), 60);
  }

  async function makePostcard({ cityId, tripId, photoId }) {
    const c = cityId && byId(cityId), t = tripId && tripById(tripId);
    if (!c && !t) return;
    toast(L('📮 Création de la carte postale…', '📮 Creating the postcard…', {pt: `📮 Criando o cartão-postal…`, es: `📮 Creando la postal…`, it: `📮 Creazione della cartolina…`, de: `📮 Postkarte wird erstellt …`}), 20000);
    try {
      try { await Promise.all(['700 80px Fraunces', '400 30px Inter', '600 30px Inter'].map(f => document.fonts.load(f))); } catch (e) {}
      const list = t ? tripCities(t) : [c];
      const photo = c ? (photoId ? c.photos.find(p => p.id === photoId) : coverPhoto(c)) : list.map(coverPhoto).find(Boolean);
      // mini-globe centré sur le lieu
      if (lb) closeLightbox();
      if (c) await flyTo(c.lat, c.lng, 8.5, 900); else await flyToFit(list, 900);
      renderer.render(scene, camera);
      const snap = renderer.domElement.toDataURL('image/png');
      const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fbf7f1'); g.addColorStop(1, '#efe4d3');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // photo
      const px = 60, py = 60, pw = 960, ph = 760;
      ctx.save(); ctx.shadowColor = 'rgba(60,40,20,.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
      ctx.fillStyle = '#fff'; ctx.fillRect(px - 14, py - 14, pw + 28, ph + 28); ctx.restore();
      if (photo) { try { drawCover(ctx, await loadImg(fullImgId(photo)), px, py, pw, ph, 6); } catch (e) {} }
      else { const gg = ctx.createLinearGradient(px, py, px + pw, py + ph); gg.addColorStop(0, '#d8e9df'); gg.addColorStop(1, '#f3e3c8'); ctx.fillStyle = gg; ctx.fillRect(px, py, pw, ph); ctx.font = '160px serif'; ctx.textAlign = 'center'; ctx.fillText(t ? '🧳' : '📍', W / 2, py + ph / 2 + 60); ctx.textAlign = 'left'; }
      // tampon : mini-globe
      const si = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = snap; });
      if (si) {
        const r0 = 128, cx = W - 175, cy = py + ph - 10;
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 24;
        ctx.beginPath(); ctx.arc(cx, cy, r0 + 12, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r0, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = '#0c1122'; ctx.fillRect(cx - r0, cy - r0, r0 * 2, r0 * 2);
        const s = Math.min(si.naturalWidth, si.naturalHeight) * 0.62;
        ctx.drawImage(si, (si.naturalWidth - s) / 2, (si.naturalHeight - s) / 2, s, s, cx - r0, cy - r0, r0 * 2, r0 * 2);
        ctx.restore();
        ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      }
      // textes
      ctx.fillStyle = '#1f1a16'; ctx.font = '700 84px Fraunces, Georgia, serif';
      const title = t ? t.name : c.name;
      const tl = wrapLines(ctx, title, 760).slice(0, 2);
      tl.forEach((l, i) => ctx.fillText(l, 60, 935 + i * 92));
      let y = 935 + (tl.length - 1) * 92 + 62;
      ctx.fillStyle = '#7a6f64'; ctx.font = '500 36px Inter, sans-serif';
      ctx.fillText(t ? [tripRange(t), plural(list.length, 'étape', 'étapes', 'stop', 'stops', {pt: [`parada`, `paradas`], es: [`parada`, `paradas`], it: [`tappa`, `tappe`], de: [`Station`, `Stationen`]})].filter(Boolean).join('  ·  ') : [countryName(c.country), formatDate(c.date)].filter(Boolean).join('  ·  '), 60, y);
      y += 58;
      ctx.fillStyle = '#3a332c'; ctx.font = '400 32px Inter, sans-serif';
      const body = t ? list.map(x => x.name).join(' → ') : ((photo && photo.caption) || c.note || '');
      wrapLines(ctx, body, 960).slice(0, Math.max(0, Math.floor((H - 130 - y) / 44))).forEach((l, i) => ctx.fillText(l, 60, y + i * 44));
      // pied
      ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(60, H - 92); ctx.lineTo(W - 60, H - 92); ctx.stroke();
      ctx.fillStyle = '#2d6a4f'; ctx.font = '600 30px Inter, sans-serif'; ctx.fillText('✈️  ' + appTitle(), 60, H - 44);
      const v = cities.filter(isBeen);
      ctx.fillStyle = '#7a6f64'; ctx.textAlign = 'right';
      ctx.fillText(`${plural(new Set(v.map(x => x.country)).size, 'pays', 'pays', 'country', 'countries', {pt: [`país`, `países`], es: [`país`, `países`], it: [`paese`, `paesi`], de: [`Land`, `Länder`]})} · ${plural(v.length, 'lieu', 'lieux', 'place', 'places', {pt: [`lugar`, `lugares`], es: [`lugar`, `lugares`], it: [`luogo`, `luoghi`], de: [`Ort`, `Orte`]})}`, W - 60, H - 44);
      ctx.textAlign = 'left';
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const safe = norm(title).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'souvenir';
      $('toast').classList.remove('show');
      const ok = await saveFile(`carte-postale-${safe}.png`, blob);
      if (ok) toast(L('📮 Carte postale prête à partager !', '📮 Postcard ready to share!', {pt: `📮 Cartão-postal pronto para compartilhar!`, es: `📮 ¡Postal lista para compartir!`, it: `📮 Cartolina pronta da condividere!`, de: `📮 Postkarte bereit zum Teilen!`}), 4000);
    } catch (e) { console.warn(e); toast(L('La carte postale n’a pas pu être créée.', "The postcard couldn't be created.", {pt: `Não foi possível criar o cartão-postal.`, es: `No se pudo crear la postal.`, it: `Impossibile creare la cartolina.`, de: `Die Postkarte konnte nicht erstellt werden.`})); }
  }
  function lbPostcard() { if (!lb) return; const c = byId(lb.cityId), p = c && c.photos[lb.index]; if (c) makePostcard({ cityId: c.id, photoId: p && !isVideo(p) ? p.id : null }); }

    const pool = cities.filter(c => isBeen(c) && c.photos.some(p => !isVideo(p)));
    if (pool.length < 3) { toast(L('Il faut au moins 3 lieux avec des photos pour jouer.', 'You need at least 3 places with photos to play.', {pt: `São necessários pelo menos 3 lugares com fotos para jogar.`, es: `Necesitas al menos 3 lugares con fotos para jugar.`, it: `Servono almeno 3 luoghi con foto per giocare.`, de: `Du brauchst mindestens 3 Orte mit Fotos zum Spielen.`}), 4500); return; }
    if (play) stopPlay();

    closeIntro(true); closeList(); closeDialog(); closeMenu();
    if (cardMode) closeCard();
    const picks = pool.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(5, pool.length)).map(c => {
      const ph = c.photos.filter(p => !isVideo(p));
      return { c, p: ph[Math.floor(Math.random() * ph.length)] };
    });
    game = { picks, i: -1, score: 0, phase: 'guess' };

  function nextRound() {
    if (!game) return;

  function gameMark(lat, lng, color, size) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).convertSRGBToLinear() }));

  function gameGuess(ll) {
    if (!game || game.phase !== 'guess') return;
    game.phase = 'reveal';
    const { c } = game.picks[game.i];
    let msg, pts = 0;
    gameMark(c.lat, c.lng, 0x2ecc71, 0.07);
    if (ll) {
      const d = distanceKm(ll, c);
      pts = Math.round(5000 * Math.exp(-d / 1500));
      game.score += pts;
      gameMark(ll.lat, ll.lng, 0xe63946, 0.06);
      drawArc(ll, c, routeMat, 900, 0.01);
      flyToFit([ll, c], 1300);
      const verdict = d < 50 ? L('🎉 Incroyable !', '🎉 Amazing!', {pt: `🎉 Incrível!`, es: `🎉 ¡Increíble!`, it: `🎉 Incredibile!`, de: `🎉 Unglaublich!`}) : d < 300 ? L('👏 Très bien !', '👏 Very good!', {pt: `👏 Muito bem!`, es: `👏 ¡Muy bien!`, it: `👏 Bravissimo!`, de: `👏 Sehr gut!`}) : d < 1500 ? L('🙂 Pas mal !', '🙂 Not bad!', {pt: `🙂 Nada mal!`, es: `🙂 ¡Nada mal!`, it: `🙂 Niente male!`, de: `🙂 Nicht schlecht!`}) : L('😅 Raté…', '😅 Missed…', {pt: `😅 Errou…`, es: `😅 Fallaste…`, it: `😅 Mancato…`, de: `😅 Daneben …`});

    } else {
      flyTo(c.lat, c.lng, 9, 1300);
      msg = `${L('C’était', 'It was', {pt: `Era`, es: `Era`, it: `Era`, de: `Es war`})} <b>${esc(c.name)}</b>, ${esc(countryName(c.country))}.`;
    }
    $('g-score').textContent = fmtNum(game.score) + ' pts';
    $('g-msg').innerHTML = msg;
    const last = game.i >= game.picks.length - 1;
    $('g-actions').innerHTML = `<button class="btn btn-primary" onclick="nextRound()">${last ? L('Voir le score 🏆', 'See the score 🏆', {pt: `Ver a pontuação 🏆`, es: `Ver la puntuación 🏆`, it: `Vedi il punteggio 🏆`, de: `Punktzahl ansehen 🏆`}) : L('Photo suivante ▶', 'Next photo ▶', {pt: `Próxima foto ▶`, es: `Foto siguiente ▶`, it: `Foto successiva ▶`, de: `Nächstes Foto ▶`})}</button>`;
  }
  function endGame() {

    const rating = pct > 0.8 ? L('🏆 Expert du globe !', '🏆 Globe expert!', {pt: `🏆 Especialista do globo!`, es: `🏆 ¡Experto del globo!`, it: `🏆 Esperto del globo!`, de: `🏆 Globus-Experte!`}) : pct > 0.55 ? L('🌍 Grand voyageur !', '🌍 Great traveller!', {pt: `🌍 Grande viajante!`, es: `🌍 ¡Gran viajero!`, it: `🌍 Grande viaggiatore!`, de: `🌍 Großer Weltenbummler!`}) : pct > 0.3 ? L('🧭 Bon sens de l’orientation', '🧭 Good sense of direction', {pt: `🧭 Bom senso de direção`, es: `🧭 Buen sentido de la orientación`, it: `🧭 Buon senso dell'orientamento`, de: `🧭 Guter Orientierungssinn`}) : L('🗺️ À réviser… mais bravo d’avoir joué !', '🗺️ Needs practice… but well played!', {pt: `🗺️ Precisa treinar… mas valeu por jogar!`, es: `🗺️ Hay que practicar… ¡pero bien jugado!`, it: `🗺️ Da ripassare… ma bravo per aver giocato!`, de: `🗺️ Noch Übung nötig … aber gut gespielt!`});

    $('g-photo').innerHTML = `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b2440,#2d6a4f);color:#fff"><div style="font-family:Fraunces,Georgia,serif;font-size:2.6rem">${fmtNum(game.score)}</div><div style="opacity:.8">/ ${fmtNum(max)} pts</div></div>`;
    $('g-msg').textContent = rating;

  // ═════════════════════════════════════════════════════════════════════
  //  SYNCHRONISATION GOOGLE DRIVE (version installable)
  //  Chaque utilisateur garde son carnet dans SON Google Drive, dans un
  //  dossier « Carnet de Voyage 3D » (accès limité aux fichiers créés par l'appli).
  // ═════════════════════════════════════════════════════════════════════
  const GD_SCOPES = 'https://www.googleapis.com/auth/drive.file openid email';
  const GD_API = 'https://www.googleapis.com/drive/v3', GD_UP = 'https://www.googleapis.com/upload/drive/v3';
  const GD_FOLDER = 'Carnet de Voyage 3D', GD_DATA = 'carnet.json';
  const syncAvailable = () => mode === 'local' && !!GDRIVE_CLIENT_ID && /^https?:$/.test(location.protocol);
  const Sync = {
    on: lsGet('gd-on', '0') === '1',
    email: lsGet('gd-email', ''),
    token: null, exp: 0, client: null,
    folder: lsGet('gd-folder', ''),
    last: +lsGet('gd-last', '0') || 0,
    state: 'off', busy: false, again: false, timer: null, index: new Map(), dl: 0, dlQueue: []
  };
  try { const t = JSON.parse(localStorage.getItem('gd-token') || 'null'); if (t && t.exp > Date.now() + 60000) { Sync.token = t.v; Sync.exp = t.exp; } } catch (e) {}
  const tokenOk = () => Sync.token && Date.now() < Sync.exp - 60000;
  let tombstones = {};

  function loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (Sync.gisP) return Sync.gisP;
    Sync.gisP = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => { Sync.gisP = null; rej(new Error('gis')); };
      document.head.appendChild(s);
    });
    return Sync.gisP;
  }
  function tokenClient() {
    if (Sync.client || !(window.google && google.accounts && google.accounts.oauth2)) return Sync.client;
    Sync.client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID, scope: GD_SCOPES,
      callback: r => {
        if (!r || r.error || !r.access_token) { Sync.pending && Sync.pending.rej(new Error((r && r.error) || 'auth')); Sync.pending = null; return; }
        Sync.token = r.access_token; Sync.exp = Date.now() + (+r.expires_in || 3600) * 1000;
        try { localStorage.setItem('gd-token', JSON.stringify({ v: Sync.token, exp: Sync.exp })); } catch (e) {}
        Sync.pending && Sync.pending.res(Sync.token); Sync.pending = null;
      },
      error_callback: err => { Sync.pending && Sync.pending.rej(new Error((err && err.type) || 'popup')); Sync.pending = null; }
    });
    return Sync.client;
  }
  // À appeler DIRECTEMENT dans un clic (sinon le navigateur bloque la fenêtre Google)
  function requestToken() {
    const c = tokenClient();
    if (!c) return Promise.reject(new Error('gis'));
    return new Promise((res, rej) => {
      Sync.pending = { res, rej };
      c.requestAccessToken({ prompt: Sync.on ? '' : 'consent', hint: Sync.email || undefined });
    });
  }
  async function gfetch(url, opts = {}) {
    if (!tokenOk()) { const e = new Error('auth'); e.auth = true; throw e; }
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + Sync.token } });
    if (r.status === 401) { Sync.token = null; const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) throw new Error('Drive ' + r.status);
    return r;
  }
  async function gdEnsureFolder() {
    if (Sync.folder) {
      try { const r = await gfetch(`${GD_API}/files/${Sync.folder}?fields=id,trashed`); const j = await r.json(); if (!j.trashed) return Sync.folder; }
      catch (e) { if (e.auth) throw e; }
    }
    const q = encodeURIComponent(`name='${GD_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const j = await (await gfetch(`${GD_API}/files?q=${q}&fields=files(id)&spaces=drive`)).json();
    let id = j.files && j.files[0] && j.files[0].id;
    if (!id) {
      const r = await gfetch(`${GD_API}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: GD_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) });
      id = (await r.json()).id;
    }
    Sync.folder = id; lsSet('gd-folder', id);
    return id;
  }
  async function gdList(folder) {
    const out = new Map(); let page = '';
    do {
      const q = encodeURIComponent(`'${folder}' in parents and trashed=false`);
      const j = await (await gfetch(`${GD_API}/files?q=${q}&pageSize=1000&fields=nextPageToken,files(id,name,createdTime)${page ? '&pageToken=' + page : ''}`)).json();
      (j.files || []).forEach(f => out.set(f.name, f));
      page = j.nextPageToken || '';
    } while (page);
    return out;
  }
  async function gdUpload(name, blob, folder, existingId) {
    if (existingId) return (await gfetch(`${GD_UP}/files/${existingId}?uploadType=media&fields=id`, { method: 'PATCH', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob })).json();
    const b = 'carnet' + uid();
    const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`, JSON.stringify({ name, parents: [folder] }), `\r\n--${b}\r\nContent-Type: ${blob.type || 'application/octet-stream'}\r\n\r\n`, blob, `\r\n--${b}--`]);
    return (await gfetch(`${GD_UP}/files?uploadType=multipart&fields=id,name,createdTime`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body })).json();
  }
  // Fusion : pour chaque lieu/voyage, la version modifiée le plus récemment gagne
  function mergeById(a, b, tomb) {
    const m = new Map();
    for (const x of [...a, ...b]) { const o = m.get(x.id); if (!o || (+x.updatedAt || 0) > (+o.updatedAt || 0)) m.set(x.id, x); }
    return [...m.values()].filter(x => !(tomb[x.id] && tomb[x.id] >= (+x.updatedAt || 0)));
  }
  async function syncNow(opts = {}) {
    if (!syncAvailable() || !Sync.on) return;
    if (Sync.busy) { Sync.again = true; return; }
    if (!tokenOk()) { setSyncState('auth'); return; }
    Sync.busy = true; setSyncState('busy');
    try {
      const folder = await gdEnsureFolder();
      const files = await gdList(folder);
      Sync.index = files;
      let remote = null;
      const df = files.get(GD_DATA);
      if (df) { try { remote = await (await gfetch(`${GD_API}/files/${df.id}?alt=media`)).json(); } catch (e) { if (e.auth) throw e; } }
      const first = !Sync.last;
      if (remote) {
        const rt = remote.tombstones || {};
        for (const k in rt) tombstones[k] = Math.max(tombstones[k] || 0, rt[k]);
        const nc = mergeById((remote.cities || []).map(normalizeCity), cities, tombstones);
        const nt = mergeById((remote.trips || []).map(normalizeTrip), trips, tombstones);
        const rs = remote.settings || {};
        let ns = settings;
        if (first) ns = { ...settings, ...rs, welcomed: true };
        else if ((+rs.updatedAt || 0) > (+settings.updatedAt || 0)) ns = rs;
        const changed = JSON.stringify([nc, nt, ns]) !== JSON.stringify([cities, trips, settings]);
        if (changed) {
          const prevMusic = settings.music && settings.music.id;
          cities = nc; trips = nt; settings = ns; sortAll();
          await Store.kvSet('cities', cities); await Store.kvSet('trips', trips); await Store.kvSet('settings', settings);
          if ((settings.music && settings.music.id) !== prevMusic) loadMusic();
          onDataChanged(); updateBranding(); updateMenu();
        }
      }
      // tombstones de plus de 6 mois : oubliés
      const old = Date.now() - 180 * 864e5;
      for (const k in tombstones) if (tombstones[k] < old) delete tombstones[k];
      await Store.kvSet('tombstones', tombstones);
      // envoie les photos qui manquent dans le Drive
      const need = [...usedFileIds()];
      const todo = [];
      for (const id of need) if (!files.has(id)) { const blob = await Store.kvGet('photo:' + id); if (blob) todo.push([id, blob]); }
      let done = 0, failed = 0;
      const worker = async () => {
        while (todo.length) {
          const [id, blob] = todo.shift();
          try { const f = await gdUpload(id, blob, folder); files.set(id, f); } catch (e) { if (e.auth) throw e; failed++; }
          done++; if (opts.verbose || done % 10 === 0) setSyncState('busy', `${done}/${done + todo.length}`);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      // envoie le carnet fusionné
